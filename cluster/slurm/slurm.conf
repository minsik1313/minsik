# Slurm 설정 — 2노드 (B=컨트롤러+컴퓨트, A=GPU 컴퓨트)
# 배치 위치: /etc/slurm/slurm.conf (양 머신 동일 파일)
# munge 키(/etc/munge/munge.key)는 양 머신 동일해야 함 (setup-slurm.sh 가 복사).

ClusterName=minsik
SlurmctldHost=machine-b               # 컨트롤러 = Machine B

# ── 통신/인증 ──
AuthType=auth/munge
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

# ── 스케줄링 ──
SchedulerType=sched/backfill
SelectType=select/cons_tres            # 코어/GPU 단위 자원 할당
SelectTypeParameters=CR_Core_Memory

# ── GPU(GRES) ──
GresTypes=gpu

# ── 타임아웃/로깅 ──
SlurmctldTimeout=120
SlurmdTimeout=300
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ReturnToService=2

# ── 노드 정의 (CPUs/Memory 는 실제 사양에 맞게 조정) ──
# Machine B: 9950X3D 16C/32T, 192GB → 가용 ~180000MB
NodeName=machine-b NodeAddr=192.168.50.11 CPUs=32 RealMemory=180000 State=UNKNOWN
# Machine A: 7900 12C/24T, 128GB, GPU 2장
NodeName=machine-a NodeAddr=192.168.50.10 CPUs=24 RealMemory=120000 Gres=gpu:2 State=UNKNOWN

# ── 파티션 ──
# sim: 회로 시뮬/리그레션 (CPU 바운드) → B
PartitionName=sim Nodes=machine-b Default=YES MaxTime=INFINITE State=UP
# gpu: GPU 가속 잡 → A
PartitionName=gpu Nodes=machine-a MaxTime=INFINITE State=UP
# all: 대규모 임베러싱리 패러렐 (양 노드)
PartitionName=all Nodes=machine-a,machine-b MaxTime=INFINITE State=UP
