name: MTU RTL CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog + Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Lint RTL (Verilator)
        run: make lint

      - name: Run cocotb testbenches
        run: make test
