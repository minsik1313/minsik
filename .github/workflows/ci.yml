name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  digital-sim:
    name: Digital regression (cocotb + Icarus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Install cocotb
        run: pip install cocotb
      - name: Run digital regression
        run: make digital-sim

  analog-autosize:
    name: Analog autosizer (voltage-domain-aware, ngspice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
      - name: Run autosizer
        run: make analog-autosize
